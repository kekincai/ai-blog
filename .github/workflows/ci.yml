name: CI

on:
  push:
    branches: [main]
  pull_request:

# 只需要读代码：显式声明只读，不依赖仓库的默认设置
permissions:
  contents: read

# 同一分支有新提交时，取消还在跑的旧检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions 固定到 commit SHA（防止标签被改写），Dependabot 会连同注释里的版本号一起更新
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # 后续步骤不需要 git 凭据
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run lint
      # 构建会解析所有文章：frontmatter 写错（如 category 无效）会在这里失败
      - name: 构建
        run: npm run build
      - name: 死链检查
        run: npm run check-links
