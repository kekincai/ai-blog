name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支有新提交时，取消还在跑的旧检查
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 类型检查 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run lint
      # 构建会解析所有文章：frontmatter 写错（如 category 无效）会在这里失败
      - name: 构建
        run: npm run build
      - name: 死链检查
        run: npm run check-links
